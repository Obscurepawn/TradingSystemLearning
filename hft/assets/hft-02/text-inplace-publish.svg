<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="341" viewBox="0 0 1280 341" role="img" aria-labelledby="title description">
<title id="title">先填写完整，再发布与复用</title>
<desc id="description">预留足够区域，直接编码，成功后发布，消费者读完后才允许复用。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="341" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">先填写完整，再发布与复用</text>
<rect x="36.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">申请足够的可写区域</text>
<rect x="454.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">直接在区域中编码消息</text>
<rect x="872.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">编码成功，发布完成位置</text>
<rect x="872.0" y="229.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">消费者读取并处理</text>
<rect x="454.0" y="229.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="472.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">读完后，允许复用该区域</text>
<path d="M 414.0 133.0 L 448.0 133.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 832.0 133.0 L 866.0 133.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 1058.0 177.0 L 1058.0 223.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 866.0 267.0 L 832.0 267.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
