<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="537" viewBox="0 0 1280 537" role="img" aria-labelledby="title description">
<title id="title">计时终点之后，还有收尾</title>
<desc id="description">事件到达与排队在业务计时之前；t_start到t_end覆盖业务处理与结果合并；CLFLUSHOPT、fence和统计在结束打点后，之后再处理下一事件。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="537" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">计时终点之后，还有收尾</text>
<rect x="36.0" y="95.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">事件到达</text>
<rect x="454.0" y="95.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="472.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">排队</text>
<rect x="872.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">t_start · 开始打点</text>
<rect x="872.0" y="229.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">业务处理与结果合并</text>
<rect x="454.0" y="229.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">t_end · 结束打点</text>
<rect x="36.0" y="229.0" width="372.0" height="76" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="54.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">CLFLUSHOPT</text>
<rect x="36.0" y="363.0" width="372.0" height="76" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="54.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">fence</text>
<rect x="454.0" y="363.0" width="372.0" height="76" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="472.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">更新统计</text>
<rect x="872.0" y="363.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="890.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">处理下一事件</text>
<path d="M 414.0 133.0 L 448.0 133.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 832.0 133.0 L 866.0 133.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 1058.0 177.0 L 1058.0 223.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 866.0 267.0 L 832.0 267.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 448.0 267.0 L 414.0 267.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 222.0 311.0 L 222.0 357.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 414.0 401.0 L 448.0 401.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 832.0 401.0 L 866.0 401.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="491" font-size="28" fill="#475569" font-weight="400" text-anchor="start">t_end − t_start 只覆盖业务区间。区间外的清除、屏障和统计仍有成本。</text>
</svg>
