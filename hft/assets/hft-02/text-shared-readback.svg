<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="709" viewBox="0 0 1280 709" role="img" aria-labelledby="title description">
<title id="title">发布相同请求，后续取值不同</title>
<desc id="description">两种写法都先写共享请求并release发布序号；原写法读回shared_request.move，改写继续使用local_move。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="709" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">发布相同请求，后续取值不同</text>
<rect x="36.0" y="95" width="590.0" height="516" rx="16" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#c2410c" font-weight="700" text-anchor="start">原写法：从共享请求读回</text>
<rect x="52.0" y="163.0" width="558.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">写入请求</text>
<text x="70.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">shared_request.move = local_move</text>
<rect x="52.0" y="341.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="389.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">release 发布请求序号</text>
<rect x="52.0" y="475.0" width="558.0" height="120" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="70.0" y="523.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主核继续计算</text>
<text x="70.0" y="567.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">使用 shared_request.move</text>
<path d="M 331.0 289.0 L 331.0 335.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 423.0 L 331.0 469.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="654.0" y="95" width="590.0" height="516" rx="16" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#0f766e" font-weight="700" text-anchor="start">改写：复用已持有的局部值</text>
<rect x="670.0" y="163.0" width="558.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">写入请求</text>
<text x="688.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">shared_request.move = local_move</text>
<rect x="670.0" y="341.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="389.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">release 发布请求序号</text>
<rect x="670.0" y="475.0" width="558.0" height="120" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="523.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主核继续计算</text>
<text x="688.0" y="567.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">使用 local_move</text>
<path d="M 949.0 289.0 L 949.0 335.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 423.0 L 949.0 469.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="663" font-size="28" fill="#475569" font-weight="400" text-anchor="start">发布步骤相同，比较的是主核后续的取值路径。</text>
</svg>
