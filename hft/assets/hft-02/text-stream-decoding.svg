<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="823" viewBox="0 0 1280 823" role="img" aria-labelledby="title description">
<title id="title">同一条消息，分三次接收</title>
<desc id="description">消息A的四个字段编码为81、01 80、02 AC、8A。三次接收逐步完成id、seq、price、qty，第三次末尾的82开始下一条消息。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="823" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">同一条消息，分三次接收</text>
<rect x="36.0" y="95" width="590.0" height="472" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">消息 A 与线上编码</text>
<rect x="52.0" y="163.0" width="558.0" height="184" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">字段取值</text>
<rect x="70.0" y="227.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="132.25" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">id</text>
<text x="132.25" y="303.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">1</text>
<rect x="202.5" y="227.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="264.75" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">seq</text>
<text x="264.75" y="303.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">128</text>
<rect x="335.0" y="227.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="397.25" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">price</text>
<text x="397.25" y="303.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">300</text>
<rect x="467.5" y="227.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="529.75" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">qty</text>
<text x="529.75" y="303.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">10</text>
<rect x="52.0" y="405.0" width="558.0" height="146" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="453.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">对应的线上字节</text>
<rect x="70.0" y="469.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="132.25" y="507.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">81</text>
<rect x="202.5" y="469.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="264.75" y="507.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">01 80</text>
<rect x="335.0" y="469.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="397.25" y="507.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">02 AC</text>
<rect x="467.5" y="469.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="529.75" y="507.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">8A</text>
<rect x="654.0" y="95" width="590.0" height="692" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">接收与解析进度</text>
<rect x="670.0" y="163.0" width="558.0" height="164" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">接收 1：81 01</text>
<text x="688.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">id 已完成</text>
<text x="688.0" y="299.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">seq 只收到第一组</text>
<rect x="670.0" y="385.0" width="558.0" height="164" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="433.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">接收 2：80 02</text>
<text x="688.0" y="477.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">seq 已完成</text>
<text x="688.0" y="521.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">price 只收到第一组</text>
<rect x="670.0" y="607.0" width="558.0" height="164" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="655.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">接收 3：AC 8A 82 …</text>
<text x="688.0" y="699.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">完成 price、qty，交付 A</text>
<text x="688.0" y="743.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">82 开始下一条消息</text>
<path d="M 949.0 333.0 L 949.0 379.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 555.0 L 949.0 601.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
