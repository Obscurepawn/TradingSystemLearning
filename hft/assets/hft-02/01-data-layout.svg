<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title description">
<title id="title">AoS、冷热分离与 SoA 的数据布局</title>
<desc id="description">三种布局都突出数量字段。AoS 中数量与价格、备注交错；冷热分离后备注单独存放；SoA 的 quantities 数组让数量字段连续。格子只表示布局关系，不表示字节比例。</desc>
