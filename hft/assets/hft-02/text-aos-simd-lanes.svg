<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="827" viewBox="0 0 1280 827" role="img" aria-labelledby="title description">
<title id="title">从交错报价到四路减法</title>
<desc id="description">AoS内每条记录包含相邻的bid与ask；向量运算先组织ask和bid两个操作数，使对应报价处于同一个lane，再逐lane相减。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="827" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">从交错报价到四路减法</text>
<rect x="36.0" y="95" width="590.0" height="222" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">AoS：每格是一条报价</text>
<rect x="52.0" y="163.0" width="558.0" height="138" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="70.0" y="181.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="132.25" y="219.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid0</text>
<text x="132.25" y="257.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask0</text>
<rect x="202.5" y="181.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="264.75" y="219.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid1</text>
<text x="264.75" y="257.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask1</text>
<rect x="335.0" y="181.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="397.25" y="219.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid2</text>
<text x="397.25" y="257.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask2</text>
<rect x="467.5" y="181.0" width="124.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="529.75" y="219.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid3</text>
<text x="529.75" y="257.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask3</text>
<rect x="654.0" y="95" width="590.0" height="634" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">整理后逐 lane 运算</text>
<rect x="670.0" y="163.0" width="558.0" height="308" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">准备两个操作数</text>
<text x="688.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">操作数 A</text>
<rect x="688.0" y="273.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="750.25" y="311.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask0</text>
<rect x="820.5" y="273.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="882.75" y="311.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask1</text>
<rect x="953.0" y="273.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1015.25" y="311.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask2</text>
<rect x="1085.5" y="273.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1147.75" y="311.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask3</text>
<text x="688.0" y="371.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">操作数 B</text>
<rect x="688.0" y="389.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="750.25" y="427.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid0</text>
<rect x="820.5" y="389.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="882.75" y="427.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid1</text>
<rect x="953.0" y="389.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1015.25" y="427.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid2</text>
<rect x="1085.5" y="389.0" width="124.5" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1147.75" y="427.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">bid3</text>
<rect x="670.0" y="529.0" width="558.0" height="184" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="577.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">对应元素相减</text>
<rect x="688.0" y="593.0" width="124.5" height="96" rx="6" fill="white" stroke="#0f766e" stroke-width="1.6"/>
<text x="750.25" y="631.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask0</text>
<text x="750.25" y="669.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">− bid0</text>
<rect x="820.5" y="593.0" width="124.5" height="96" rx="6" fill="white" stroke="#0f766e" stroke-width="1.6"/>
<text x="882.75" y="631.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask1</text>
<text x="882.75" y="669.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">− bid1</text>
<rect x="953.0" y="593.0" width="124.5" height="96" rx="6" fill="white" stroke="#0f766e" stroke-width="1.6"/>
<text x="1015.25" y="631.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask2</text>
<text x="1015.25" y="669.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">− bid2</text>
<rect x="1085.5" y="593.0" width="124.5" height="96" rx="6" fill="white" stroke="#0f766e" stroke-width="1.6"/>
<text x="1147.75" y="631.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">ask3</text>
<text x="1147.75" y="669.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">− bid3</text>
<path d="M 949.0 477.0 L 949.0 523.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="781" font-size="28" fill="#475569" font-weight="400" text-anchor="start">同一组报价的 ask 与 bid 位于相同 lane。格子表示元素关系，不代表字节比例。</text>
</svg>
