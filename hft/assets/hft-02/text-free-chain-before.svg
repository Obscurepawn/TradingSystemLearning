<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="423" viewBox="0 0 1280 423" role="img" aria-labelledby="title description">
<title id="title">归还前：槽位 3 已借出</title>
<desc id="description">head等于0，空闲链为0到1到2到结束标记4，槽位3已借出不在空闲链中。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="423" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">归还前：槽位 3 已借出</text>
<rect x="36.0" y="95" width="590.0" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">空闲链按 next_ 连接</text>
<rect x="52.0" y="163.0" width="558.0" height="146" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">head_ = 0</text>
<rect x="70.0" y="227.0" width="108.0" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="124.0" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">0</text>
<rect x="208.0" y="227.0" width="108.0" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="262.0" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">1</text>
<path d="M 182.0 256.0 L 204.0 256.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="346.0" y="227.0" width="108.0" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="400.0" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">2</text>
<path d="M 320.0 256.0 L 342.0 256.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="484.0" y="227.0" width="108.0" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="538.0" y="265.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">N=4</text>
<path d="M 458.0 256.0 L 480.0 256.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="654.0" y="95" width="590.0" height="160" rx="16" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#7c3aed" font-weight="700" text-anchor="start">已借出</text>
<rect x="670.0" y="163.0" width="558.0" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">槽位 3</text>
<text x="36" y="377" font-size="28" fill="#475569" font-weight="400" text-anchor="start">N = 4 是结束标记，不是可访问的槽位。</text>
</svg>
