<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="313" viewBox="0 0 1280 313" role="img" aria-labelledby="title description">
<title id="title">五个打点，四段处理</title>
<desc id="description">C0到C1解码，C1到C2更新订单簿，C2到C3策略计算，C3到C4风控与编码，总区间C4减C0。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="313" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">五个打点，四段处理</text>
<rect x="36.0" y="95.0" width="267.5" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">C0 → C1</text>
<text x="54.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">解码</text>
<rect x="349.5" y="95.0" width="267.5" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="367.5" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">C1 → C2</text>
<text x="367.5" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">更新订单簿</text>
<rect x="663.0" y="95.0" width="267.5" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="681.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">C2 → C3</text>
<text x="681.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">策略计算</text>
<rect x="976.5" y="95.0" width="267.5" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="994.5" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">C3 → C4</text>
<text x="994.5" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">风控与编码</text>
<path d="M 309.5 155.0 L 343.5 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 623.0 155.0 L 657.0 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 936.5 155.0 L 970.5 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="267" font-size="28" fill="#475569" font-weight="400" text-anchor="start">应用处理总耗时 = C4 − C0。相邻阶段共用边界打点。</text>
</svg>
