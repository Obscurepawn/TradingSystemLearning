<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="877" viewBox="0 0 1280 877" role="img" aria-labelledby="title description">
<title id="title">时间戳怎样交给统计线程</title>
<desc id="description">业务线程写入预分配队列并发布完整StageTrace后继续业务；统计线程通过try_pop取得局部副本，计算差值、更新直方图并定期上报。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="877" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">时间戳怎样交给统计线程</text>
<rect x="36.0" y="108.0" width="581.0" height="164" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="156.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">业务线程 worker</text>
<text x="54.0" y="200.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">处理业务，记录时间戳</text>
<text x="54.0" y="244.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">生成完整的 StageTrace</text>
<rect x="663.0" y="95.0" width="581.0" height="190" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="681.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">try_push 成功：写入并发布</text>
<text x="681.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">预分配的环形队列</text>
<rect x="681.0" y="203.0" width="176.33333333333334" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="769.1666666666666" y="241.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">记录</text>
<rect x="865.3333333333334" y="203.0" width="176.33333333333334" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="953.5" y="241.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">记录</text>
<rect x="1049.6666666666667" y="203.0" width="176.33333333333334" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1137.8333333333335" y="241.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">空槽</text>
<path d="M 623.0 190.0 L 657.0 190.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 953.5 285.0 L 953.5 315" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round" />
<path d="M 330.0 315 L 950.0 315" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round" />
<path d="M 330.0 315 L 330.0 345" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="36.0" y="351" width="588.0" height="160" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="397" font-size="30" fill="#2563eb" font-weight="700" text-anchor="start">业务线程继续推进</text>
<rect x="52.0" y="419.0" width="556.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="467.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">处理下一条业务消息</text>
<path d="M 950.0 315 L 950.0 345" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="656.0" y="351" width="588.0" height="428" rx="16" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="672.0" y="397" font-size="30" fill="#7c3aed" font-weight="700" text-anchor="start">统计线程独立取数</text>
<rect x="672.0" y="419.0" width="556.0" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="690.0" y="467.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">try_pop → 局部副本</text>
<rect x="672.0" y="553.0" width="556.0" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="690.0" y="601.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">计算时间差，更新直方图</text>
<rect x="672.0" y="687.0" width="556.0" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="690.0" y="735.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">定期上报聚合指标</text>
<path d="M 950.0 501.0 L 950.0 547.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 950.0 635.0 L 950.0 681.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="831" font-size="28" fill="#475569" font-weight="400" text-anchor="start">发布后两条路径可以独立推进，业务线程不等待统计完成。</text>
</svg>
