<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="339" viewBox="0 0 1280 339" role="img" aria-labelledby="title description">
<title id="title">归还后：槽位 3 成为链表头</title>
<desc id="description">归还槽位3后head等于3，空闲链变成3到0到1到2到结束标记4。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="339" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">归还后：槽位 3 成为链表头</text>
<rect x="36.0" y="95.0" width="1208.0" height="146" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">head_ = 3</text>
<rect x="54.0" y="159.0" width="210.4" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="159.2" y="197.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">3</text>
<rect x="294.4" y="159.0" width="210.4" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="399.59999999999997" y="197.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">0</text>
<path d="M 268.4 188.0 L 290.4 188.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="534.8" y="159.0" width="210.4" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="640.0" y="197.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">1</text>
<path d="M 508.79999999999995 188.0 L 530.8 188.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="775.2" y="159.0" width="210.4" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="880.4000000000001" y="197.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">2</text>
<path d="M 749.2 188.0 L 771.2 188.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="1015.6" y="159.0" width="210.4" height="58" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1120.8" y="197.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">N=4</text>
<path d="M 989.6 188.0 L 1011.6 188.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="293" font-size="28" fill="#475569" font-weight="400" text-anchor="start">新归还的槽位接在原链表头前。对象仍留在原数组位置。</text>
</svg>
