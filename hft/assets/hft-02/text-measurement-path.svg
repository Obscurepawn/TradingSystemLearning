<text x="367.5" y="183.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">情</text>
<rect x="663.0" y="115.0" width="267.5" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="681.0" y="163.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">解码</text>
<rect x="976.5" y="115.0" width="267.5" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="994.5" y="163.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">更新订单簿</text>
<rect x="976.5" y="311.0" width="267.5" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="994.5" y="359.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">策略计算</text>
<rect x="663.0" y="269.0" width="267.5" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
