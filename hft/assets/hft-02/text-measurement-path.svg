<text x="681.0" y="357.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">编码</text>
<text x="681.0" y="401.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">订单已准备完毕</text>
<rect x="349.5" y="311.0" width="267.5" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="367.5" y="359.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">提交发送</text>
