<text x="54.0" y="339.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">H1 · 网卡发出</text>
<text x="54.0" y="379.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">订单</text>
<rect x="36.0" y="487.0" width="267.5" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="535.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">网络传输</text>
<rect x="349.5" y="487.0" width="267.5" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="367.5" y="535.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">交易所处理</text>
