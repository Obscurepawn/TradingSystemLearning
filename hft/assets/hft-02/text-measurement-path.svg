<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="661" viewBox="0 0 1280 661" role="img" aria-labelledby="title description">
<title id="title">行情到订单：打点在哪里</title>
<desc id="description">行情依次经过网卡、应用处理、发送与交易所。H0/H1是网卡边界，C0/C4是应用处理边界。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="661" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">行情到订单：打点在哪里</text>
<rect x="36.0" y="95.0" width="267.5" height="116" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">H0 · 网卡收到</text>
<text x="54.0" y="183.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">行情</text>
