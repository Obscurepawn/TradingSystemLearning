<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="621" viewBox="0 0 1280 621" role="img" aria-labelledby="title description">
<title id="title">先取一小批，再分别计算</title>
<desc id="description">逐项处理在每次读取后执行长计算；批内重排先收集A、B、C输入，再计算各项，让独立访存有机会重叠。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="621" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">先取一小批，再分别计算</text>
<rect x="36.0" y="95" width="590.0" height="428" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">逐项处理</text>
<rect x="52.0" y="163.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">A：读取 → 长计算</text>
<rect x="52.0" y="297.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">B：读取 → 长计算</text>
<rect x="52.0" y="431.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="479.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">C：读取 → 长计算</text>
<path d="M 331.0 245.0 L 331.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 379.0 L 331.0 425.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="654.0" y="95" width="590.0" height="294" rx="16" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#0f766e" font-weight="700" text-anchor="start">批内两阶段</text>
<rect x="670.0" y="163.0" width="558.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">收集 A、B、C 的输入</text>
<rect x="670.0" y="297.0" width="558.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">分别计算 A、B、C</text>
<path d="M 949.0 245.0 L 949.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="575" font-size="28" fill="#475569" font-weight="400" text-anchor="start">这些工作项已经可用，不需要等待多条行情凑批。重排以工作项相互独立为前提。</text>
</svg>
