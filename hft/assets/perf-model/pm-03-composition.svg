<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
<defs><marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c2410c"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="1280" height="600" fill="#ffffff"/>
<text x="44" y="50" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="27" font-weight="600" fill="#15243b">三种合成方式：依赖链相加，独立操作取最紧资源，内存请求靠并发摊薄</text>
<text x="44" y="82" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#64748b">同样是“很多次操作”，能否重叠执行决定了总时间是相加还是取最大值</text>
<rect x="40.0" y="106.0" width="380.0" height="300.0" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="58.0" y="138.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="18" font-weight="600" fill="#15243b" text-anchor="start">① 依赖链：延迟相加</text>
<rect x="460.0" y="106.0" width="380.0" height="300.0" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="478.0" y="138.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="18" font-weight="600" fill="#15243b" text-anchor="start">② 独立操作：按吞吐重叠</text>
<rect x="880.0" y="106.0" width="380.0" height="300.0" rx="10" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="898.0" y="138.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="18" font-weight="600" fill="#15243b" text-anchor="start">③ 内存级并行：Little 定律</text>
<rect x="64.0" y="162.0" width="72.0" height="28.0" rx="4" fill="#2563eb" stroke="none"/>
<text x="100.0" y="181.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">fadd</text>
<line x1="136.0" y1="176.0" x2="142.0" y2="216.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="140.0" y="202.0" width="72.0" height="28.0" rx="4" fill="#2563eb" stroke="none"/>
<text x="176.0" y="221.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">fadd</text>
<line x1="212.0" y1="216.0" x2="218.0" y2="256.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="216.0" y="242.0" width="72.0" height="28.0" rx="4" fill="#2563eb" stroke="none"/>
<text x="252.0" y="261.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">fadd</text>
<line x1="288.0" y1="256.0" x2="294.0" y2="296.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ag)"/>
<rect x="292.0" y="282.0" width="72.0" height="28.0" rx="4" fill="#2563eb" stroke="none"/>
<text x="328.0" y="301.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">fadd</text>
<line x1="64.0" y1="334.0" x2="374.0" y2="334.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="374.0" y="352.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#64748b" text-anchor="end">时间</text>
<text x="60.0" y="380.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="400" fill="#15243b" text-anchor="start">s += a[i]：每次等上一次结果</text>
<text x="60.0" y="400.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="600" fill="#2563eb" text-anchor="start">4 次 × 4 周期 = 16 周期</text>
<rect x="484.0" y="160.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="493.5" y="180.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="503.0" y="200.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="512.5" y="220.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="522.0" y="240.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="531.5" y="260.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="541.0" y="280.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<rect x="550.5" y="300.0" width="76.0" height="15.0" rx="3" fill="#059669" stroke="none"/>
<line x1="484.0" y1="334.0" x2="794.0" y2="334.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="794.0" y="352.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#64748b" text-anchor="end">时间</text>
<text x="654.0" y="200.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="14" font-weight="400" fill="#64748b" text-anchor="start">每个仍需 4 周期</text>
<text x="654.0" y="222.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="14" font-weight="400" fill="#64748b" text-anchor="start">但每周期能开始 2 个</text>
<text x="480.0" y="380.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="400" fill="#15243b" text-anchor="start">8 次独立加法：2 个浮点端口</text>
<text x="480.0" y="400.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="600" fill="#059669" text-anchor="start">约 4 + 3.5 = 7.5 周期，稳态 0.5 周期/次</text>
<rect x="904.0" y="158.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="907.0" y="174.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="910.0" y="190.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="913.0" y="206.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="916.0" y="222.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="919.0" y="238.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="922.0" y="254.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="925.0" y="270.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="928.0" y="286.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<rect x="931.0" y="302.0" width="300.0" height="12.0" rx="3" fill="#c2410c" stroke="none"/>
<line x1="904.0" y1="334.0" x2="1234.0" y2="334.0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="1234.0" y="352.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#64748b" text-anchor="end">时间</text>
<text x="900.0" y="380.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="400" fill="#15243b" text-anchor="start">10 个独立 miss 同时在途，每个 64 ns</text>
<text x="900.0" y="400.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="600" fill="#c2410c" text-anchor="start">平均 64 ÷ 10 ≈ 6.4 ns/次</text>
<rect x="40.0" y="430.0" width="1200.0" height="140.0" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="640.0" y="474.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="21" font-weight="600" fill="#15243b" text-anchor="middle">T ≈ max( 关键依赖链 , 前端宽度 , 各执行端口 , 各级带宽 ) + Σ 事件次数 × 单次惩罚</text>
<text x="640.0" y="512.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" font-weight="400" fill="#15243b" text-anchor="middle">并发上限 = min( 程序里真正独立的请求数 , 填充缓冲区数 ≈ 10–12 , ROB / load buffer 能容纳的请求数 )</text>
<text x="640.0" y="546.0" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">分支误预测、系统调用、上下文切换会清空或打断流水线，不能被重叠，只能相加</text>
</svg>