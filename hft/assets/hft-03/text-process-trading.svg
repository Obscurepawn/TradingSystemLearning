<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="399" viewBox="0 0 1600 399" role="img" aria-labelledby="title description">
<title id="title">三个进程的交易路径</title>
<desc id="description">行情 A/B 进入 market-data；market-data 发送行情事件到 strategy；strategy 发送订单意图到 order-gateway；order-gateway 向交易所发单，并将委托与成交回报反向传递给 strategy。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1600" height="399" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">三个进程的交易路径</text>
<rect x="36.0" y="136.0" width="268.8" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="54.0" y="184.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">行情 A/B</text>
<rect x="350.8" y="95.0" width="268.8" height="158" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="368.8" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">market-data</text>
<text x="368.8" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">向策略发送</text>
<text x="368.8" y="225.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">行情事件</text>
<rect x="665.6" y="95.0" width="268.8" height="158" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="683.6" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">strategy</text>
<text x="683.6" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">向网关提交</text>
<text x="683.6" y="225.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">订单意图</text>
<rect x="980.4000000000001" y="114.0" width="268.8" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="998.4000000000001" y="162.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">order-gateway</text>
<text x="998.4000000000001" y="206.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">向交易所发单</text>
<rect x="1295.2" y="136.0" width="268.8" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="1313.2" y="184.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">交易所</text>
<path d="M 310.8 174.0 L 344.8 174.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 625.6 174.0 L 659.6 174.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 940.4000000000001 174.0 L 974.4000000000001 174.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 1255.2 174.0 L 1289.2 174.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 1114.8000000000002 239.0 L 1114.8000000000002 313 L 800.0 313 L 800.0 258.0" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="957.4000000000001" y="351" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">委托 / 成交回报</text>
</svg>
