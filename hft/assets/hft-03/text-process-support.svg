<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="469" viewBox="0 0 1280 469" role="img" aria-labelledby="title description">
<title id="title">记录、控制与观测</title>
<desc id="description">market-data 的数据进入独立记录路径；控制面进程向各业务进程发送配置、启停与主备身份；各业务进程向观测进程发送计数器和采样事件。这三组关系相互独立，不表示先后顺序。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="469" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">记录、控制与观测</text>
<rect x="36.0" y="95" width="384.0" height="294" rx="16" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#0f766e" font-weight="700" text-anchor="start">独立记录路径</text>
<rect x="52.0" y="163.0" width="352.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">market-data</text>
<rect x="52.0" y="297.0" width="352.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="70.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">独立记录</text>
<path d="M 228.0 245.0 L 228.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="448.0" y="95" width="384.0" height="338" rx="16" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="464.0" y="141" font-size="30" fill="#7c3aed" font-weight="700" text-anchor="start">控制面下发管理信息</text>
<rect x="464.0" y="163.0" width="352.0" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="482.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">控制面进程</text>
<text x="482.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">配置、启停、主备身份</text>
<rect x="464.0" y="341.0" width="352.0" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="482.0" y="389.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">各业务进程</text>
<path d="M 640.0 289.0 L 640.0 335.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="860.0" y="95" width="384.0" height="338" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="876.0" y="141" font-size="30" fill="#64748b" font-weight="700" text-anchor="start">业务进程上报观测信息</text>
<rect x="876.0" y="163.0" width="352.0" height="120" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="894.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">各业务进程</text>
<text x="894.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">计数器、采样事件</text>
<rect x="876.0" y="341.0" width="352.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="894.0" y="389.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">观测进程</text>
<path d="M 1052.0 289.0 L 1052.0 335.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
