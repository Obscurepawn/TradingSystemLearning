<rect x="454.0" y="229.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">策略</text>
<rect x="36.0" y="229.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">风控与订单编码</text>
<rect x="36.0" y="363.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="54.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">本机发送队列与网卡</text>
<rect x="454.0" y="363.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="472.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">接入线路</text>
