<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="475" viewBox="0 0 1280 475" role="img" aria-labelledby="title description">
<title id="title">跨机器的消息路径</title>
<desc id="description">消息在主机 A 从业务线程经过发送缓冲、网络收发组件和网卡，穿过网络后，在主机 B 从网卡经过网络收发组件和接收缓冲，最终交给业务线程。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="475" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">跨机器的消息路径</text>
<rect x="36.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 A · 业务线程</text>
<rect x="454.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 A · 发送缓冲</text>
<rect x="872.0" y="95.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 A · 网络收发组件</text>
<rect x="872.0" y="229.0" width="372.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 A · 网卡</text>
<rect x="454.0" y="229.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="472.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">网络</text>
<rect x="36.0" y="229.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="54.0" y="277.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 B · 网卡</text>
<rect x="36.0" y="363.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="54.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 B · 网络收发组件</text>
<rect x="454.0" y="363.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="472.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 B · 接收缓冲</text>
<rect x="872.0" y="363.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="890.0" y="411.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">主机 B · 业务线程</text>
