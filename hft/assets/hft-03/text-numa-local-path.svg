<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="291" viewBox="0 0 1280 291" role="img" aria-labelledby="title description">
<title id="title">同一 NUMA 节点内的数据路径</title>
<desc id="description">NIC 通过本地 PCIe 到达本节点的接收内存，本节点上的行情、策略和网关线程使用接收数据，并沿本地发送路径发出。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="291" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">同一 NUMA 节点内的数据路径</text>
<rect x="36.0" y="115.0" width="267.5" height="120" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="54.0" y="163.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">NIC</text>
<text x="54.0" y="207.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">经本地 PCIe</text>
<rect x="349.5" y="117.0" width="267.5" height="116" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="367.5" y="165.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">本节点的</text>
<text x="367.5" y="205.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">接收内存</text>
<rect x="663.0" y="95.0" width="267.5" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="681.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">本节点上的</text>
<text x="681.0" y="183.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">业务线程</text>
<text x="681.0" y="227.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">行情 / 策略 / 网关</text>
<rect x="976.5" y="137.0" width="267.5" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="994.5" y="185.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">本地发送路径</text>
<path d="M 309.5 175.0 L 343.5 175.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 623.0 175.0 L 657.0 175.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 936.5 175.0 L 970.5 175.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
