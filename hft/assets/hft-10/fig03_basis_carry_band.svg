<text x="166" y="481.46153846153845" font-size="16" font-weight="400" text-anchor="start" style="fill:#6b7280" >现货 S（到期收敛线）</text>
<text x="1160" y="180" font-size="18" font-weight="600" text-anchor="end" style="fill:#059669" >正向套利区（上沿以上）：买现货篮子 · 卖期货，持有到收敛</text>
<rect x="470" y="463.693453560354" width="340" height="32" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="660.0" y="485.693453560354" font-size="18" font-weight="600" text-anchor="middle" style="fill:#111827" >无套利区间：F*−c ≤ F_market ≤ F*+c</text>
<text x="1160" y="598" font-size="18" font-weight="600" text-anchor="end" style="fill:#ea580c" >反向套利区（下沿以下）：买期货 · 卖空现货，需融券（国内券源少、成本高，机会稀少）</text>
<circle cx="405.0" cy="222.3" r="7" fill="#059669" stroke="#ffffff" stroke-width="2"/>
<rect x="421.0" y="196.30769230769232" width="330" height="48" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="435.0" y="216.30769230769232" font-size="16" font-weight="600" text-anchor="start" style="fill:#059669" >示例 F_market=5075 &gt; 上沿 5067.64</text>
<text x="435.0" y="236.30769230769232" font-size="16" font-weight="400" text-anchor="start" style="fill:#6b7280" >毛利 37.36 − 成本 30 = 净利 7.36 点</text>
<text x="166" y="341.3784615384604" font-size="17" font-weight="600" text-anchor="start" style="fill:#2563eb" >理论价 F*=S·e^(r−q)T</text>
<text x="166" y="236.91692307692188" font-size="15" font-weight="400" text-anchor="start" style="fill:#059669" >成本带上沿（正向触发）</text>
<rect x="160" y="552" width="330" height="26" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="166" y="570" font-size="15" font-weight="400" text-anchor="start" style="fill:#ea580c" >成本带下沿（反向触发，融券成本推宽）</text>
<line x1="150" y1="130" x2="150" y2="620" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gray)"/>
<line x1="150" y1="620" x2="1170" y2="620" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#gray)"/>
<text x="142" y="120" font-size="16" font-weight="400" text-anchor="start" style="fill:#6b7280" >期货价格 F</text>
<text x="1170" y="654" font-size="16" font-weight="400" text-anchor="end" style="fill:#6b7280" >剩余时间 t → 到期 T（基差收敛为 0）</text>
<rect x="48" y="690" width="1184" height="96" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="66" y="722" font-size="16" font-weight="400" text-anchor="start" style="fill:#6b7280" >示例：S=5000，r=5.0%，q=2.0%，T=0.25 年 → F*≈5037.64；往返成本 c=30 点，区间 [5007.64, 5067.64]。</text>
<text x="66" y="752" font-size="16" font-weight="400" text-anchor="start" style="fill:#6b7280" >国内融券贵、券源少，反向触发需要更深贴水，区间下宽上窄；实证正向偏离远多于反向（约 36.2% vs 0.2%）。</text>
</svg>
