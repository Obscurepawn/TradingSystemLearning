<text x="48" y="48" font-size="28" font-weight="600" text-anchor="start" style="fill:#111827" >期现基差与无套利区间：理论期货价随到期收敛到现货</text>
<text x="48" y="80" font-size="17" font-weight="400" text-anchor="start" style="fill:#6b7280" >实际期货价穿出成本带上沿 / 下沿才有净利润；带内只观察不交易。</text>
