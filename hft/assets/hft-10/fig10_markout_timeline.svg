<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
<defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/></marker></defs>
<text x="48" y="48" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="28" fill="#111827" font-weight="600" text-anchor="start">做市成交质量：markout 时间线（成交后 h 时刻按 mid 重估）</text>
<text x="48" y="80" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="17" fill="#6b7280" font-weight="400" text-anchor="start">以买入一腿为例（z=+1）：把成交后 mid 相对成交价的位移，分解为成交前价格优势与成交后逆向选择。</text>
<line x1="240" y1="420" x2="660" y2="420" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#gray)"/>
<text x="668" y="450" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">时间 →</text>
<line x1="240" y1="256.6666666666556" x2="1150" y2="256.6666666666556" stroke="#c7cdd6" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1178" y="261.6666666666556" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="14" fill="#6b7280" font-weight="400" text-anchor="end">100.01</text>
<line x1="240" y1="280.0" x2="1150" y2="280.0" stroke="#c7cdd6" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1178" y="285.0" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="14" fill="#6b7280" font-weight="400" text-anchor="end">100.00</text>
<line x1="240" y1="373.3333333333444" x2="1150" y2="373.3333333333444" stroke="#c7cdd6" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="1178" y="378.3333333333444" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="14" fill="#6b7280" font-weight="400" text-anchor="end">99.96</text>
<path d="M 290,256.7 L 620,373.3" fill="none" stroke="#374151" stroke-width="2.6"/>
<circle cx="290" cy="256.7" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<circle cx="450" cy="280.0" r="8" fill="#ea580c" stroke="#fff" stroke-width="2"/>
<circle cx="620" cy="373.3" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="290" y="234.6666666666556" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">成交前：mid m = 100.01</text>
<text x="468" y="270.0" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#ea580c" font-weight="600" text-anchor="start">t_f 成交：买入 p_f = 100.00（z = +1）</text>
<text x="620" y="403.3333333333444" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#2563eb" font-weight="600" text-anchor="middle">t_f+h：mid m = 99.96</text>
<line x1="290" y1="420" x2="290" y2="430" stroke="#9ca3af" stroke-width="1.5"/>
<text x="290" y="450" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#6b7280" font-weight="400" text-anchor="middle">成交前</text>
<line x1="450" y1="420" x2="450" y2="430" stroke="#9ca3af" stroke-width="1.5"/>
<text x="450" y="450" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#6b7280" font-weight="400" text-anchor="middle">t_f（成交）</text>
<line x1="620" y1="420" x2="620" y2="430" stroke="#9ca3af" stroke-width="1.5"/>
<text x="620" y="450" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#6b7280" font-weight="400" text-anchor="middle">t_f + h</text>
<line x1="780" y1="256.6666666666556" x2="780" y2="280.0" stroke="#059669" stroke-width="2.2"/>
<path d="M 780,256.6666666666556 L 768,256.6666666666556" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#green)"/>
<path d="M 780,280.0 L 768,280.0" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#green)"/>
<text x="796" y="273.3333333333278" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#059669" font-weight="600" text-anchor="start">+0.01 成交前优势</text>
<line x1="925" y1="256.6666666666556" x2="925" y2="373.3333333333444" stroke="#ea580c" stroke-width="2.2"/>
<path d="M 925,256.6666666666556 L 913,256.6666666666556" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#orange)"/>
<path d="M 925,373.3333333333444 L 913,373.3333333333444" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#orange)"/>
<text x="941" y="320.0" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#ea580c" font-weight="600" text-anchor="start">−0.05 逆向选择</text>
<line x1="1055" y1="280.0" x2="1055" y2="373.3333333333444" stroke="#2563eb" stroke-width="2.2"/>
<path d="M 1055,280.0 L 1043,280.0" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 1055,373.3333333333444 L 1043,373.3333333333444" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="1071" y="331.6666666666722" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#2563eb" font-weight="600" text-anchor="start">M_h = −0.04</text>
<rect x="90" y="540" width="340" height="150" rx="10" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1.5"/>
<text x="114" y="580" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="19" fill="#059669" font-weight="600" text-anchor="start">① 成交前价格优势</text>
<text x="114" y="620" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="17" fill="#111827" font-weight="600" text-anchor="start">m(成交前) − p_f = +0.01</text>
<text x="114" y="656" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">低于成交前 mid 买入，先赚到约半个价差。</text>
<rect x="470" y="540" width="340" height="150" rx="10" fill="#fff7ed" stroke="#d1d5db" stroke-width="1.5"/>
<text x="494" y="580" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="19" fill="#ea580c" font-weight="600" text-anchor="start">② 成交后价格变化</text>
<text x="494" y="620" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="17" fill="#111827" font-weight="600" text-anchor="start">m(t_f+h) − m(成交前) = −0.05</text>
<text x="494" y="656" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">持仓方向上 mid 继续走反，即逆向选择。</text>
<rect x="850" y="540" width="340" height="150" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="874" y="580" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="19" fill="#2563eb" font-weight="600" text-anchor="start">③ 合计 markout</text>
<text x="874" y="620" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="17" fill="#111827" font-weight="600" text-anchor="start">M_h = z(m_{t_f+h} − p_f) = −0.04</text>
<text x="874" y="656" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">h 时刻按 mid 重估这笔持仓的浮动盈亏。</text>
<rect x="48" y="730" width="1184" height="44" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="66" y="758" font-family='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#6b7280" font-weight="400" text-anchor="start">净价值 = M_h + 返佣 − 手续费 − 退出成本，才是这笔成交的净贡献；对比多个 h（100ms / 1s / 10s）观察逆向选择随时间如何展开。</text>
</svg>