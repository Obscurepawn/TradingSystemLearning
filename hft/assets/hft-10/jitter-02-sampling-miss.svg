<text x="210" y="490" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" font-weight="400" fill="#15243b" text-anchor="start">就算真撞上了，等你看到报表、attach 上去，那次抖动早就结束了——案发现场只存在于它发生的那几十微秒</text>
