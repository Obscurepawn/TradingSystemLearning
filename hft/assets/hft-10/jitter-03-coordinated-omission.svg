<text x="585" y="92" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">卡顿期间本应发出的请求：从未发出，也就永远不会出现在统计里</text>
<line x1="478" y1="120" x2="490" y2="162" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="700" y="170" width="26" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" opacity="1.0"/>
<rect x="734" y="170" width="26" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" opacity="1.0"/>
<rect x="768" y="170" width="26" height="30" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" opacity="1.0"/>
<line x1="70" y1="234" x2="1100" y2="234" stroke="#64748b" stroke-width="1.4"/>
<text x="70" y="258" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#64748b" text-anchor="start">时间 →</text>
<text x="770" y="272" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" font-weight="600" fill="#15243b" text-anchor="start">压测器实测分布</text>
<rect x="770" y="294" width="34" height="92" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1.0"/>
<rect x="814" y="371" width="34" height="15" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="1" opacity="1.0"/>
<text x="830" y="412" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#64748b" text-anchor="start">只有卡住的那 1 笔被记成慢请求，尾巴几乎看不见</text>
<line x1="760" y1="386" x2="1030" y2="386" stroke="#15243b" stroke-width="1.4"/>
<text x="770" y="464" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" font-weight="600" fill="#15243b" text-anchor="start">校正后（open-loop + recordCorrectedValue）</text>
<rect x="770" y="484" width="34" height="92" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1" opacity="1.0"/>
<rect x="814" y="536" width="28" height="40" rx="3" fill="#fca5a5" stroke="#fca5a5" stroke-width="1" opacity="1.0"/>
<rect x="848" y="522" width="28" height="54" rx="3" fill="#fca5a5" stroke="#fca5a5" stroke-width="1" opacity="1.0"/>
<rect x="882" y="510" width="28" height="66" rx="3" fill="#fca5a5" stroke="#fca5a5" stroke-width="1" opacity="1.0"/>
<rect x="916" y="498" width="28" height="78" rx="3" fill="#fca5a5" stroke="#fca5a5" stroke-width="1" opacity="1.0"/>
<rect x="950" y="486" width="28" height="90" rx="3" fill="#fca5a5" stroke="#fca5a5" stroke-width="1" opacity="1.0"/>
<text x="880" y="602" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#64748b" text-anchor="start">缺席的请求全部补记为受影响延迟，尾巴现形</text>
<line x1="760" y1="576" x2="1030" y2="576" stroke="#15243b" stroke-width="1.4"/>
<rect x="70" y="430" width="640" height="150" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" opacity="1.0"/>
<text x="96" y="464" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" font-weight="600" fill="#c2410c" text-anchor="start">对策</text>
<text x="96" y="494" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="400" fill="#15243b" text-anchor="start">① 改用开环（open-loop）压测：请求按独立时钟发出，不等上一笔返回</text>
<text x="96" y="522" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="400" fill="#15243b" text-anchor="start">② HdrHistogram 的 recordCorrectedValue：把卡顿区间内应发未发的请求</text>
<text x="112" y="546" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="400" fill="#15243b" text-anchor="start">按预期发起时间一并记成受影响延迟</text>
</svg>