<rect x="608" y="104" width="26" height="30" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="5 4" opacity="1.0"/>
<text x="621" y="140" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="12" font-weight="600" fill="#dc2626" text-anchor="middle">✕</text>
<rect x="644" y="104" width="26" height="30" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="5 4" opacity="1.0"/>
