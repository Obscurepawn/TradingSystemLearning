<rect x="490" y="162" width="190" height="46" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="2" opacity="1.0"/>
<text x="585" y="182" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="15" font-weight="600" fill="#dc2626" text-anchor="middle">卡在这一笔上</text>
<text x="585" y="202" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="13" font-weight="400" fill="#dc2626" text-anchor="middle">（尾延迟尖峰）</text>
