<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
<rect x="0" y="0" width="1280" height="620" fill="#ffffff"/>
<text x="44" y="50" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="27" font-weight="600" fill="#15243b">还有一种看不见，是压测器自己瞎了</text>
<text x="44" y="80" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="16" fill="#64748b">Coordinated Omission：闭环压测线程被卡住时，卡顿期间本应发出的请求根本没有出生，尾部门形被系统性低估</text>
<text x="70" y="130" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' font-size="17" font-weight="600" fill="#15243b" text-anchor="start">闭环压测线程（发一个、等一个）</text>
