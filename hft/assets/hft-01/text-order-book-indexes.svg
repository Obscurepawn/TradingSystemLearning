<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="513" viewBox="0 0 1280 513" role="img" aria-labelledby="title description">
<title id="title">本地订单簿的两组索引</title>
<desc id="description">按 order_id 查找方向、价格、剩余数量和公开的优先级信息；按价格档位查找该价位上的订单和总数量。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="513" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">本地订单簿的两组索引</text>
<rect x="36.0" y="95" width="590.0" height="382" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#2563eb" font-weight="700" text-anchor="start">按订单标识查找</text>
<rect x="52.0" y="163.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">order_id</text>
<rect x="52.0" y="297.0" width="558.0" height="164" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">对应订单信息</text>
<text x="70.0" y="389.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">方向、价格、剩余数量</text>
<text x="70.0" y="433.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">公开的优先级信息</text>
<path d="M 331.0 245.0 L 331.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="654.0" y="95" width="590.0" height="382" rx="16" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#0f766e" font-weight="700" text-anchor="start">按价格档位查找</text>
<rect x="670.0" y="163.0" width="558.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">价格档位</text>
<rect x="670.0" y="297.0" width="558.0" height="164" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">对应价位信息</text>
<text x="688.0" y="389.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">该价位上的订单</text>
<text x="688.0" y="433.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">总数量</text>
<path d="M 949.0 245.0 L 949.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
