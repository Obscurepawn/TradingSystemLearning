<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="649" viewBox="0 0 1280 649" role="img" aria-labelledby="title description">
<title id="title">同价队列与成交数量</title>
<desc id="description">100.00 的买方队列中，你的 100 股订单排在竞争者的 100 股订单前；随后 120 股主动卖单到达，你成交 100 股，竞争者成交 20 股。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="649" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">同价队列与成交数量</text>
<rect x="36.0" y="95.0" width="581.0" height="230" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">同价买单：100.00</text>
<text x="54.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">队列从前到后</text>
<rect x="54.0" y="205.0" width="268.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="188.25" y="243.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">1 · 你的订单</text>
<text x="188.25" y="281.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">100 股</text>
<rect x="330.5" y="205.0" width="268.5" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="464.75" y="243.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">2 · 竞争者订单</text>
<text x="464.75" y="281.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">100 股</text>
<rect x="663.0" y="150.0" width="581.0" height="120" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="681.0" y="198.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">随后主动卖单到达</text>
<text x="681.0" y="242.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">只有 120 股</text>
<rect x="663.0" y="383.0" width="581.0" height="230" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="681.0" y="431.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">按队列顺序成交</text>
<text x="681.0" y="475.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">成交数量</text>
<rect x="681.0" y="493.0" width="268.5" height="96" rx="6" fill="white" stroke="#0f766e" stroke-width="1.6"/>
<text x="815.25" y="531.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">你</text>
<text x="815.25" y="569.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">100 股</text>
<rect x="957.5" y="493.0" width="268.5" height="96" rx="6" fill="white" stroke="#0f766e" stroke-width="1.6"/>
<text x="1091.75" y="531.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">竞争者</text>
<text x="1091.75" y="569.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">20 股</text>
<path d="M 623.0 210.0 L 657.0 210.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 953.5 276.0 L 953.5 377.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
