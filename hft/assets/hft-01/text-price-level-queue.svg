<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="753" viewBox="0 0 1280 753" role="img" aria-labelledby="title description">
<title id="title">买方订单簿的价位与队列</title>
<desc id="description">100.01 元档位有 D 的 100 股订单；100.00 元档位从队首到队尾依次是 A、B、C，各 100 股；所有订单均尚未成交。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="753" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">买方订单簿的价位与队列</text>
<rect x="36.0" y="95" width="590.0" height="204" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#2563eb" font-weight="700" text-anchor="start">100.01 元</text>
<rect x="52.0" y="163.0" width="558.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">D</text>
<text x="70.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">100 股</text>
<rect x="654.0" y="95" width="590.0" height="560" rx="16" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#0f766e" font-weight="700" text-anchor="start">100.00 元：从队首到队尾</text>
<rect x="670.0" y="163.0" width="558.0" height="120" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">A</text>
<text x="688.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">100 股</text>
<rect x="670.0" y="341.0" width="558.0" height="120" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="389.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">B</text>
<text x="688.0" y="433.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">100 股</text>
<rect x="670.0" y="519.0" width="558.0" height="120" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="688.0" y="567.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">C</text>
<text x="688.0" y="611.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">100 股</text>
<path d="M 949.0 289.0 L 949.0 335.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 467.0 L 949.0 513.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="707" font-size="28" fill="#475569" font-weight="400" text-anchor="start">所有订单都还没有成交。</text>
</svg>
