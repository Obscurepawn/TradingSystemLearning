<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="251" viewBox="0 0 1280 251" role="img" aria-labelledby="title description">
<title id="title">从股票篮子到 ETF 卖出</title>
<desc id="description">买入规定股票并补足现金，再申购 ETF，最后卖出 ETF。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="251" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">从股票篮子到 ETF 卖出</text>
<rect x="36.0" y="95.0" width="372.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="54.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">买入规定股票</text>
<text x="54.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">并补足现金</text>
<rect x="454.0" y="117.0" width="372.0" height="76" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="472.0" y="165.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">申购 ETF</text>
<rect x="872.0" y="117.0" width="372.0" height="76" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<text x="890.0" y="165.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">卖出 ETF</text>
<path d="M 414.0 155.0 L 448.0 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 832.0 155.0 L 866.0 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
</svg>
