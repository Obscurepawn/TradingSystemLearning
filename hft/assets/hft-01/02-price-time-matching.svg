<text x="70" y="854" font-size="22" fill="#111827" font-weight="400" text-anchor="start">S3 虽然更早进入队列，但卖价更高，仍排在 S1、S2 后面。</text>
<text x="70" y="893" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">限价控制可接受的价格边界；本例按簿上对手订单的价格成交。</text>
