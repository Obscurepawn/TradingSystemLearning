<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title description">
  <title id="title">Shared feature dependencies</title>
  <desc id="description">Mid reads Book state. Both Recent 2 and Recent 10 read Mid when handling a Trade. Their values form the feature vector.</desc>
  <!-- Editable SVG source. Preview with: rsvg-convert flex-model-shared-mid.svg -o preview.png -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
    <marker id="trade-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #1e293b; }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .label { font-size: 19px; text-anchor: middle; }
      .edge-label { font-size: 16px; text-anchor: middle; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .trade { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#trade-arrow); }
    </style>
  </defs>

  <rect width="960" height="270" fill="#ffffff"/>
  <text x="24" y="31" font-size="22" font-weight="600">Shared feature dependencies</text>

  <g id="dependencies">
    <path id="book-to-mid" class="edge" d="M 144 150 H 224"/>
    <text class="edge-label" x="184" y="137">state</text>
    <path id="mid-to-recent2" class="trade" d="M 328 150 H 400 V 86 H 528"/>
    <text class="edge-label" x="464" y="72">Trade input</text>
    <path id="mid-to-recent10" class="trade" d="M 328 150 H 400 V 214 H 528"/>
    <text class="edge-label" x="464" y="200">Trade input</text>
    <path id="recent2-to-output" class="edge" d="M 664 86 H 724 V 138 H 792"/>
    <text class="edge-label" x="696" y="72">value</text>
    <path id="recent10-to-output" class="edge" d="M 664 214 H 724 V 162 H 792"/>
    <text class="edge-label" x="696" y="200">value</text>
  </g>

  <g id="book">
    <rect class="node" x="24" y="122" width="120" height="56" rx="8"/>
    <text class="label" x="84" y="157">Book</text>
  </g>
  <g id="mid">
    <rect x="224" y="122" width="104" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text class="label" x="276" y="157">Mid</text>
  </g>
  <g id="recent2">
    <rect class="node" x="528" y="58" width="136" height="56" rx="8"/>
    <text class="label" x="596" y="93">Recent 2</text>
  </g>
  <g id="recent10">
    <rect class="node" x="528" y="186" width="136" height="56" rx="8"/>
    <text class="label" x="596" y="221">Recent 10</text>
  </g>
  <g id="output">
    <rect class="node" x="792" y="122" width="144" height="56" rx="8"/>
    <text class="label" x="864" y="145">Feature</text>
    <text class="label" x="864" y="167">vector</text>
  </g>
</svg>
