<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 885" width="1200" height="885">
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;fill:#111827} .title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#4b5563}.node{font-size:23px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#4b5563}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="885" fill="#ffffff"/>
<text x="40" y="48" text-anchor="start" class="title">同步链路与应用读时钟，是两条相关的路径</text>
<text x="40" y="82" text-anchor="start" class="sub">示例：PTP 校正网卡 PHC，再由 phc2sys 校正系统时间；TSC 提供计数。</text>
<rect x="40" y="140" width="160" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="120.0" y="176" text-anchor="middle" class="node">GNSS</text>
<text x="120.0" y="208" text-anchor="middle" class="body">授时参考</text>
<rect x="280" y="140" width="170" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="365.0" y="176" text-anchor="middle" class="node">PTP GM</text>
<text x="365.0" y="208" text-anchor="middle" class="body">主时钟</text>
<rect x="520" y="140" width="170" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="605.0" y="176" text-anchor="middle" class="node">ptp4l</text>
<text x="605.0" y="208" text-anchor="middle" class="body">PTP 同步程序</text>
<rect x="760" y="140" width="170" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="845.0" y="176" text-anchor="middle" class="node">PHC</text>
<text x="845.0" y="208" text-anchor="middle" class="body">网卡硬件时钟</text>
<rect x="1000" y="140" width="160" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="1080.0" y="176" text-anchor="middle" class="node">phc2sys</text>
<text x="1080.0" y="208" text-anchor="middle" class="body">时钟同步程序</text>
<line x1="200" y1="192" x2="280" y2="192" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="190.0" y="101" width="100" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="240.0" y="122" text-anchor="middle" class="small">PPS / 时刻</text>
<line x1="450" y1="192" x2="520" y2="192" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="441.0" y="101" width="88" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="485.0" y="122" text-anchor="middle" class="small">PTP 报文</text>
<line x1="690" y1="192" x2="760" y2="192" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
<rect x="702.0" y="101" width="46" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="725.0" y="122" text-anchor="middle" class="small">校正</text>
<line x1="930" y1="192" x2="1000" y2="192" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="942.0" y="101" width="46" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="965.0" y="122" text-anchor="middle" class="small">读数</text>
<rect x="800" y="390" width="360" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="980.0" y="426" text-anchor="middle" class="node">Linux timekeeping</text>
<text x="980.0" y="458" text-anchor="middle" class="body">时间基准、换算参数与校正状态</text>
<line x1="1080" y1="245" x2="1080" y2="390" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
<rect x="1017.0" y="301" width="126" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1080" y="322" text-anchor="middle" class="small">校正系统时间</text>
<rect x="400" y="390" width="230" height="110" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="515.0" y="426" text-anchor="middle" class="node">CPU TSC</text>
<text x="515.0" y="458" text-anchor="middle" class="body">硬件计数器</text>
<line x1="630" y1="445" x2="800" y2="445" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="639.0" y="407" width="152" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="715" y="428" text-anchor="middle" class="small">clocksource 输入</text>
<rect x="40" y="390" width="220" height="110" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="150.0" y="426" text-anchor="middle" class="node">应用</text>
<text x="150.0" y="458" text-anchor="middle" class="body">clock_gettime()</text>
<rect x="40" y="640" width="220" height="110" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="150.0" y="676" text-anchor="middle" class="node">glibc</text>
<text x="150.0" y="708" text-anchor="middle" class="body">时间 API 包装</text>
<line x1="150" y1="500" x2="150" y2="640" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="125.0" y="551" width="50" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="150" y="572" text-anchor="middle" class="small">调用</text>
<rect x="400" y="640" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="515.0" y="676" text-anchor="middle" class="node">vDSO</text>
<text x="515.0" y="708" text-anchor="middle" class="body">在用户态构造时间</text>
<line x1="260" y1="695" x2="400" y2="695" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="255.0" y="601" width="150" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="330" y="622" text-anchor="middle" class="small">支持时走快速路径</text>
<line x1="515" y1="500" x2="515" y2="640" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="468.0" y="551" width="94" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="515" y="572" text-anchor="middle" class="small">读取计数</text>
<path d="M 980,500 L 980,695 L 630,695" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
<rect x="888.0" y="551" width="184" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="980" y="572" text-anchor="middle" class="small">提供基准与换算参数</text>
<rect x="40" y="795" width="1120" height="57" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60" y="830" text-anchor="start" class="small">此图假设 TSC 被选为可用 clocksource；不支持的查询或环境会使用系统调用等路径。</text>
<line x1="45" y1="300" x2="90" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<text x="102" y="306" text-anchor="start" class="small">参考、读数或调用</text>
<line x1="325" y1="300" x2="370" y2="300" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
<text x="382" y="306" text-anchor="start" class="small">调整被同步的时钟</text>
<text x="680" y="306" text-anchor="start" class="small">PTP 不直接给物理 TSC 调频。</text>
</svg>
