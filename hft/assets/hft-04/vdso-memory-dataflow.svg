<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1150" width="1400" height="1150">
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;fill:#111827}.title{font-size:30px;font-weight:600}.subtitle{font-size:19px;fill:#4b5563}.section{font-size:22px;font-weight:600}.node{font-size:21px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#4b5563}.tiny{font-size:16px;fill:#4b5563}.blue{fill:#1d4ed8}.green{fill:#15803d}.orange{fill:#c2410c}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1400" height="1150" fill="#ffffff"/>
<text x="40" y="49" text-anchor="start" class="title">vDSO 读时间：同一进程内调用，必要时仍会进入内核</text>
<text x="40" y="86" text-anchor="start" class="subtitle">Linux x86-64 + glibc；快路径示例：CLOCK_MONOTONIC，TSC 被选为 clocksource。</text>
<rect x="40" y="130" width="350" height="720" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="60" y="165" text-anchor="start" class="section">同一进程的用户虚拟地址空间</text>
<text x="60" y="193" text-anchor="start" class="small">示意分区，非固定地址或排列顺序</text>
<rect x="60" y="215" width="310" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="80" y="245" text-anchor="start" class="node blue">① 程序 text / data</text>
<text x="80" y="271" text-anchor="start" class="small">应用代码与数据</text>
<rect x="60" y="300" width="310" height="58" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="215" y="335" text-anchor="middle" class="body">⋯  堆 / 栈 / 其他映射  ⋯</text>
<rect x="60" y="375" width="310" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="80" y="407" text-anchor="start" class="node blue">② 普通动态库 libc.so.6</text>
<text x="80" y="435" text-anchor="start" class="small">clock_gettime() 包装代码</text>
<rect x="60" y="472" width="310" height="83" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="80" y="503" text-anchor="start" class="node">动态链接器 ld-linux</text>
<text x="80" y="533" text-anchor="start" class="small">解析 / 缓存 vDSO 入口</text>
<rect x="60" y="572" width="310" height="101" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="80" y="604" text-anchor="start" class="node blue">③ [vdso]：RX 代码</text>
<text x="80" y="635" text-anchor="start" class="body">__vdso_clock_gettime</text>
<text x="80" y="660" text-anchor="start" class="small">与 libc 一样，在用户态执行</text>
<rect x="60" y="690" width="310" height="133" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="80" y="722" text-anchor="start" class="node green">[vvar]：RO 时间数据</text>
<text x="80" y="753" text-anchor="start" class="body">基准时间 / 基准计数</text>
<text x="80" y="780" text-anchor="start" class="body">mult / shift / 序列号 seq</text>
<text x="80" y="808" text-anchor="start" class="small">用户只读，内核更新底层数据</text>
<rect x="430" y="130" width="930" height="720" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="450" y="165" text-anchor="start" class="section">调用与数据流</text>
<text x="790" y="165" text-anchor="start" class="small">编号对应左侧代码映射</text>
<rect x="480" y="195" width="230" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="595" y="227" text-anchor="middle" class="node blue">① 应用</text>
<text x="595" y="256" text-anchor="middle" class="body">clock_gettime()</text>
<rect x="790" y="195" width="250" height="80" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="915" y="227" text-anchor="middle" class="node blue">② glibc 包装</text>
<text x="915" y="256" text-anchor="middle" class="small">选用已解析的 vDSO 入口</text>
<path d="M 710,235 L 790,235" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="726.0" y="196" width="48" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="750" y="216" text-anchor="middle" class="small">调用</text>
<rect x="480" y="322" width="230" height="140" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="500" y="354" text-anchor="start" class="node green">正常快速路径</text>
<text x="500" y="386" text-anchor="start" class="body">执行用户态代码</text>
<text x="500" y="415" text-anchor="start" class="body">读取参数与硬件计数</text>
<text x="500" y="444" text-anchor="start" class="body green">无需进入内核</text>
<rect x="790" y="360" width="250" height="100" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="915" y="393" text-anchor="middle" class="node blue">③ vDSO 入口</text>
<text x="915" y="422" text-anchor="middle" class="body">__vdso_clock_gettime</text>
<text x="915" y="449" text-anchor="middle" class="small">判断查询 / 时钟模式是否支持</text>
<path d="M 915,275 L 915,360" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="852.0" y="304" width="126" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="915" y="324" text-anchor="middle" class="small">调用可用入口</text>
<rect x="1080" y="195" width="240" height="100" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1200" y="227" text-anchor="middle" class="body orange">A  无可用 vDSO 入口</text>
<text x="1200" y="257" text-anchor="middle" class="body">glibc 发起系统调用</text>
<text x="1200" y="283" text-anchor="middle" class="small">未进入 vDSO</text>
<path d="M 1040,235 L 1080,235" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<rect x="1080" y="360" width="240" height="124" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1200" y="392" text-anchor="middle" class="body orange">B  已进入 vDSO</text>
<text x="1200" y="420" text-anchor="middle" class="body">clockid 不支持，或</text>
<text x="1200" y="446" text-anchor="middle" class="body">clocksource 模式不支持</text>
<text x="1200" y="469" text-anchor="middle" class="small">vDSO 内部发起系统调用</text>
<path d="M 1040,410 L 1080,410" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 1320,245 L 1340,245 L 1340,710 L 1215,710 L 1215,770" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 1320,418 L 1340,418" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
<circle cx="1340" cy="418" r="4" fill="#ea580c"/>
<rect x="1137.0" y="724" width="156" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1215" y="744" text-anchor="middle" class="small orange">两条回退路径汇合</text>
<rect x="790" y="530" width="250" height="200" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="915" y="565" text-anchor="middle" class="node green">vDSO 快速路径</text>
<text x="810" y="600" text-anchor="start" class="body">读 seq 与基准参数</text>
<text x="810" y="634" text-anchor="start" class="body">读 TSC → 换算时间</text>
<text x="810" y="668" text-anchor="start" class="body">再读 seq，校验一致性</text>
<text x="810" y="706" text-anchor="start" class="small green">seq 变化 → 重新读取</text>
<path d="M 915,460 L 915,530" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="891.0" y="485" width="48" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="915" y="505" text-anchor="middle" class="small">支持</text>
<rect x="480" y="530" width="230" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="595" y="563" text-anchor="middle" class="node green">[vvar] 只读映射</text>
<text x="595" y="593" text-anchor="middle" class="small">左侧同一份时间数据</text>
<text x="595" y="618" text-anchor="middle" class="small">基准、换算参数、seq</text>
<path d="M 710,582 L 790,582" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="726.0" y="542" width="48" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="750" y="562" text-anchor="middle" class="small green">参数</text>
<rect x="464" y="658" width="262" height="135" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="595" y="685" text-anchor="middle" class="small">硬件（不属于进程内存）</text>
<rect x="480" y="700" width="230" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="595" y="730" text-anchor="middle" class="node green">CPU TSC</text>
<text x="595" y="758" text-anchor="middle" class="small">读取当前硬件计数</text>
<path d="M 710,736 L 750,736 L 750,654 L 790,654" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="726.0" y="677" width="48" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="750" y="697" text-anchor="middle" class="small green">计数</text>
<rect x="790" y="770" width="250" height="64" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="915" y="797" text-anchor="middle" class="body blue">写回 timespec</text>
<text x="915" y="824" text-anchor="middle" class="small">经 glibc 向应用返回状态</text>
<path d="M 915,730 L 915,770" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1090" y="770" width="250" height="80" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1215" y="803" text-anchor="middle" class="node orange">syscall 指令</text>
<text x="1215" y="832" text-anchor="middle" class="small">从相应调用点进入内核</text>
<path d="M 40,900 L 1360,900" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-dasharray="7,6"/>
<rect x="433.0" y="866" width="74" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="470" y="886" text-anchor="middle" class="small">用户态</text>
<rect x="433.0" y="909" width="74" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="470" y="929" text-anchor="middle" class="small">内核态</text>
<rect x="60" y="950" width="310" height="80" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="215" y="981" text-anchor="middle" class="node">内核 timekeeping</text>
<text x="215" y="1011" text-anchor="middle" class="small">维护基准时间与换算参数</text>
<path d="M 215,950 L 215,823" stroke="#6b7280" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-dasharray="6,5" marker-end="url(#arrow-gray)"/>
<rect x="150.0" y="858" width="130" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="215" y="878" text-anchor="middle" class="small">后台更新 vvar</text>
<rect x="1090" y="950" width="250" height="80" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1215" y="982" text-anchor="middle" class="node">内核 clock_gettime</text>
<text x="1215" y="1012" text-anchor="middle" class="small">处理后返回原调用链</text>
<path d="M 1150,850 L 1150,950" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M 1280,950 L 1280,850" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1126.0" y="871" width="48" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1150" y="891" text-anchor="middle" class="small orange">进入</text>
<rect x="1256.0" y="871" width="48" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1280" y="891" text-anchor="middle" class="small blue">返回</text>
<rect x="40" y="1064" width="1320" height="58" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M 60,1093 L 105,1093" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="118" y="1099" text-anchor="start" class="small">调用 / 返回</text>
<path d="M 350,1093 L 395,1093" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="408" y="1099" text-anchor="start" class="small">时间数据读取</text>
<path d="M 660,1093 L 705,1093" stroke="#ea580c" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="718" y="1099" text-anchor="start" class="small">系统调用回退</text>
<path d="M 1010,1093 L 1055,1093" stroke="#6b7280" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-dasharray="6,5" marker-end="url(#arrow-gray)"/>
<text x="1068" y="1099" text-anchor="start" class="small">后台更新</text>
</svg>
