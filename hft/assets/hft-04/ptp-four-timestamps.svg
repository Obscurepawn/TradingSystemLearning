<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890">
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;fill:#111827} .title{font-size:30px;font-weight:600}.sub{font-size:18px;fill:#4b5563}.node{font-size:23px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#4b5563}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#ea580c"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
</defs>
<rect width="1200" height="890" fill="#ffffff"/>
<text x="40" y="48" text-anchor="start" class="title">PTP 用四个时间戳估计偏移与路径时延</text>
<text x="40" y="82" text-anchor="start" class="sub">简化 E2E 模型：θ = 从时钟 − 主时钟；本轮交换期间，θ 近似不变。</text>
<rect x="160" y="135" width="280" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="300.0" y="171" text-anchor="middle" class="node">主时钟</text>
<text x="300.0" y="203" text-anchor="middle" class="body">记录 t1、t4</text>
<rect x="760" y="135" width="280" height="90" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="900.0" y="171" text-anchor="middle" class="node">从时钟</text>
<text x="900.0" y="203" text-anchor="middle" class="body">记录 t2、t3</text>
<line x1="300" y1="225" x2="300" y2="570" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="900" y1="225" x2="900" y2="570" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="80" y1="265" x2="80" y2="550" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="80" y="590" text-anchor="middle" class="small">时间向下</text>
<line x1="300" y1="280" x2="900" y2="355" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="521.0" y="286" width="158" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="600" y="307" text-anchor="middle" class="small">Sync：主 → 从</text>
<text x="277" y="277" text-anchor="end" class="node">t1</text>
<text x="925" y="363" text-anchor="start" class="node">t2</text>
<rect x="511.0" y="339" width="178" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="600" y="360" text-anchor="middle" class="small">前向路径时延 d_f</text>
<line x1="900" y1="430" x2="300" y2="505" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="493.0" y="436" width="214" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="600" y="457" text-anchor="middle" class="small">Delay_Req：从 → 主</text>
<text x="925" y="438" text-anchor="start" class="node">t3</text>
<text x="277" y="514" text-anchor="end" class="node">t4</text>
<rect x="511.0" y="489" width="178" height="28" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="600" y="510" text-anchor="middle" class="small">反向路径时延 d_r</text>
<circle cx="300" cy="280" r="5" fill="#2563eb"/>
<circle cx="900" cy="355" r="5" fill="#2563eb"/>
<circle cx="900" cy="430" r="5" fill="#2563eb"/>
<circle cx="300" cy="505" r="5" fill="#2563eb"/>
<rect x="40" y="620" width="1120" height="140" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="65" y="657" text-anchor="start" class="node">两组观测</text>
<text x="65" y="696" text-anchor="start" class="body">a = t2 − t1 = d_f + θ</text>
<text x="65" y="733" text-anchor="start" class="body">b = t4 − t3 = d_r − θ</text>
<text x="600" y="657" text-anchor="start" class="node">路径对称时：d_f = d_r</text>
<text x="600" y="696" text-anchor="start" class="body">θ = (a − b) / 2</text>
<text x="600" y="733" text-anchor="start" class="body">单向路径时延 d = (a + b) / 2</text>
<text x="40" y="802" text-anchor="start" class="body">双步模式的 Follow_Up 携带 t1；Delay_Resp 将 t4 送回从时钟。</text>
<text x="40" y="837" text-anchor="start" class="small">图中省略 correctionField 等修正；路径不对称会给偏移估计带来 (d_f − d_r) / 2 的误差。</text>
</svg>
