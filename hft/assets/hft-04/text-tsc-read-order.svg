<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="933" viewBox="0 0 1280 933" role="img" aria-labelledby="title description">
<title id="title">读钟位置决定计时边界</title>
<desc id="description">对照期望顺序与一种可能的乱序执行：裸 RDTSC 可能在加载数据返回、计算完成之前取得终点读数，导致测量漏掉后半段耗时。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="933" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">读钟位置决定计时边界</text>
<rect x="36.0" y="95" width="590.0" height="696" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#2563eb" font-weight="700" text-anchor="start">希望测到的顺序</text>
<rect x="52.0" y="163.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">读取起点</text>
<rect x="52.0" y="297.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">发起加载</text>
<rect x="52.0" y="431.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="479.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">数据返回</text>
<rect x="52.0" y="565.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="613.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">计算完成</text>
<rect x="52.0" y="699.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="747.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">读取终点</text>
<path d="M 331.0 245.0 L 331.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 379.0 L 331.0 425.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 513.0 L 331.0 559.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 647.0 L 331.0 693.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="654.0" y="95" width="590.0" height="740" rx="16" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#c2410c" font-weight="700" text-anchor="start">可能发生的顺序</text>
<rect x="670.0" y="163.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">读取起点</text>
<rect x="670.0" y="297.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">发起加载</text>
<rect x="670.0" y="431.0" width="558.0" height="120" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="688.0" y="479.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">提前读取终点</text>
<text x="688.0" y="523.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">裸 RDTSC 可能在此执行</text>
<rect x="670.0" y="609.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="657.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">数据返回</text>
<rect x="670.0" y="743.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="791.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">计算完成</text>
<path d="M 949.0 245.0 L 949.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 379.0 L 949.0 425.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 557.0 L 949.0 603.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 691.0 L 949.0 737.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="887" font-size="28" fill="#475569" font-weight="400" text-anchor="start">后一种顺序漏掉数据返回与计算完成前的后半段耗时。</text>
</svg>
