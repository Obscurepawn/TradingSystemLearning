<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="617" viewBox="0 0 1280 617" role="img" aria-labelledby="title description">
<title id="title">业务计时与循环收尾</title>
<desc id="description">消费者先取得事件，在起点和终点读数之间执行业务计算、等待并合并结果。清除缓存行、fence 和统计更新在终点读数之后，随后才处理下一事件；收尾仍然占用完整消费者循环。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="617" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">业务计时与循环收尾</text>
<rect x="36.0" y="117.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="54.0" y="165.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">取得事件</text>
<rect x="454.0" y="95.0" width="372.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="472.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">读取起点</text>
<text x="472.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">业务计时从这里开始</text>
<rect x="872.0" y="95.0" width="372.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="143.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">业务计算</text>
<text x="890.0" y="187.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">等待并合并结果</text>
<rect x="872.0" y="336.0" width="372.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="890.0" y="384.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">读取终点</text>
<text x="890.0" y="428.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">业务计时到这里结束</text>
<rect x="454.0" y="273.0" width="372.0" height="246" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="472.0" y="321.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">结束打点后的收尾</text>
<text x="472.0" y="365.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">① 清除缓存行</text>
<text x="472.0" y="403.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">（CLFLUSHOPT）</text>
<text x="472.0" y="447.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">② fence</text>
<text x="472.0" y="491.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">③ 更新统计</text>
<rect x="36.0" y="358.0" width="372.0" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="54.0" y="406.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">处理下一事件</text>
<path d="M 414.0 155.0 L 448.0 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 832.0 155.0 L 866.0 155.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 1058.0 221.0 L 1058.0 330.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 866.0 396.0 L 832.0 396.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 448.0 396.0 L 414.0 396.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="571" font-size="28" fill="#475569" font-weight="400" text-anchor="start">收尾位于业务计时区间之外，仍占用完整循环，并可能推迟下一事件。</text>
</svg>
