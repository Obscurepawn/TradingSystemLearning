<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1065" viewBox="0 0 1280 1065" role="img" aria-labelledby="title description">
<title id="title">业务转发与旁路测量</title>
<desc id="description">同一个业务报文沿发送端、A 入口、网络路径、B 入口、接收端正常转发。A、B 在各自入口记录 tA、tB，各自的镜像副本和时间戳送入旁路采集机，配对同一报文并在共同时间基准上计算 tB−tA。采集机位于独立的镜像旁路，不是业务转发必经路径。</desc>
<style>text { font-family: "Noto Sans CJK SC", sans-serif; }</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="1065" fill="white"/>
<text x="36" y="58" font-size="36" fill="#15243b" font-weight="700" text-anchor="start">业务转发与旁路测量</text>
<rect x="36.0" y="95" width="590.0" height="872" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="52.0" y="141" font-size="30" fill="#2563eb" font-weight="700" text-anchor="start">业务路径</text>
<rect x="52.0" y="163.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">发送端</text>
<rect x="52.0" y="297.0" width="558.0" height="164" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="345.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">A 的入口</text>
<text x="70.0" y="389.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">记录 tA</text>
<text x="70.0" y="433.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">镜像副本携带 tA</text>
<rect x="52.0" y="519.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="567.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">网络路径</text>
<rect x="52.0" y="653.0" width="558.0" height="164" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="701.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">B 的入口</text>
<text x="70.0" y="745.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">记录 tB</text>
<text x="70.0" y="789.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">镜像副本携带 tB</text>
<rect x="52.0" y="875.0" width="558.0" height="76" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="70.0" y="923.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">接收端</text>
<path d="M 331.0 245.0 L 331.0 291.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 467.0 L 331.0 513.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 601.0 L 331.0 647.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 331.0 823.0 L 331.0 869.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="654.0" y="95" width="590.0" height="848" rx="16" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="670.0" y="141" font-size="30" fill="#0f766e" font-weight="700" text-anchor="start">镜像旁路：独立采集</text>
<rect x="670.0" y="163.0" width="558.0" height="230" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="211.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">两处镜像来源汇入</text>
<text x="688.0" y="255.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">来自 A、B 两处入口</text>
<rect x="688.0" y="273.0" width="257.0" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="816.5" y="311.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">A 的副本</text>
<text x="816.5" y="349.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">及 tA</text>
<rect x="953.0" y="273.0" width="257.0" height="96" rx="6" fill="white" stroke="#2563eb" stroke-width="1.6"/>
<text x="1081.5" y="311.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">B 的副本</text>
<text x="1081.5" y="349.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="middle">及 tB</text>
<rect x="670.0" y="451.0" width="558.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="499.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">旁路采集机</text>
<text x="688.0" y="543.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">接收两处镜像副本</text>
<rect x="670.0" y="629.0" width="558.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="677.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">配对同一报文</text>
<text x="688.0" y="721.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">时间戳换算至共同时间基准</text>
<rect x="670.0" y="807.0" width="558.0" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="688.0" y="855.0" font-size="30" fill="#15243b" font-weight="700" text-anchor="start">计算 tB − tA</text>
<text x="688.0" y="899.0" font-size="28" fill="#15243b" font-weight="400" text-anchor="start">测量边界：A 入口到 B 入口</text>
<path d="M 949.0 399.0 L 949.0 445.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 577.0 L 949.0 623.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<path d="M 949.0 755.0 L 949.0 801.0" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="36" y="1019" font-size="28" fill="#475569" font-weight="400" text-anchor="start">镜像副本的到达顺序可以变化；保留原始时间戳并正确配对，才能计算这段延迟。</text>
</svg>
