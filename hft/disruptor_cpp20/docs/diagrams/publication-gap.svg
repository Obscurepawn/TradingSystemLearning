<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" role="img">
<title>申请顺序与发布顺序可以不同</title>
<desc>P0 先申请 0，P1 后申请 1；消费者仍必须先处理 0。</desc>
<style>text { font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; fill: #111827; } .sub { fill: #6b7280; }</style>
<defs>
<marker id="m2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="m059669" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
<marker id="mea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="m7c3aed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
<marker id="m6b7280" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="772" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="40" y="48" font-size="30" text-anchor="start" class="main" font-weight="600">申请顺序与发布顺序可以不同</text>
<text x="40" y="86" font-size="20" text-anchor="start" class="sub" font-weight="400">P0 先申请 0，P1 后申请 1；消费者仍必须先处理 0。</text>
<rect x="45" y="120" width="280" height="75" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="185.0" y="155" font-size="23" text-anchor="middle" class="main" font-weight="600">生产者 P0</text>
<path d="M185 195 V675" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
<rect x="460" y="120" width="280" height="75" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600.0" y="155" font-size="23" text-anchor="middle" class="main" font-weight="600">生产者 P1</text>
<path d="M600 195 V675" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
<rect x="875" y="120" width="280" height="75" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="1015.0" y="155" font-size="23" text-anchor="middle" class="main" font-weight="600">消费者</text>
<path d="M1015 195 V675" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
<rect x="174" y="240" width="22" height="255" rx="2" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="127.67999999999999" y="202" width="114.64000000000001" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="185" y="222" font-size="18" text-anchor="middle" class="main" font-weight="400">申请 s = 0</text>
<rect x="542.68" y="222" width="114.64000000000001" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="600" y="242" font-size="18" text-anchor="middle" class="main" font-weight="400">申请 s = 1</text>
<path d="M600 295 H1015" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#m2563eb)"/>
<rect x="708.48" y="262" width="183.04" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="800" y="282" font-size="18" text-anchor="middle" class="main" font-weight="400">published[1] = 1</text>
<rect x="875" y="335" width="280" height="105" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1015.0" y="370" font-size="23" text-anchor="middle" class="main" font-weight="600">next = 0，继续等待</text>
<text x="1015.0" y="401" font-size="18.053596614950635" text-anchor="middle" class="main" font-weight="400">slot[0].published 仍为 -1</text>
<text x="1015.0" y="429" font-size="15.183867141162516" text-anchor="middle" class="main" font-weight="400">claimed() = 1 不能证明 0 已发布</text>
<rect x="104.46000000000001" y="362" width="161.07999999999998" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="185" y="382" font-size="18" text-anchor="middle" class="main" font-weight="400">writer 仍未返回</text>
<path d="M196 495 H590 Q600 483 610 495 H1015" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#m2563eb)"/>
<rect x="678.48" y="457" width="183.04" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="770" y="477" font-size="18" text-anchor="middle" class="main" font-weight="400">published[0] = 0</text>
<rect x="875" y="550" width="280" height="105" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="1015.0" y="585" font-size="21.070234113712377" text-anchor="middle" class="main" font-weight="600">连续区间 [0, 1] 可消费</text>
<text x="1015.0" y="616" font-size="14.901047729918513" text-anchor="middle" class="main" font-weight="400">依次执行 handler(0)、handler(1)</text>
<text x="1015.0" y="644" font-size="19" text-anchor="middle" class="main" font-weight="400">按批更新 completed</text>
<text x="40" y="710" font-size="21" text-anchor="start" class="sub" font-weight="400">published 是每槽位的代际标记；实现没有用“最大已发布序号”跨过缺口。</text>
</svg>
