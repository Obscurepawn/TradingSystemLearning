<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 972" width="1200" height="972" role="img">
<title>消费者如何挑选一批可处理的事件</title>
<desc>示例：next = 3，claimed = 9，A 完成 6，B 完成 4，max_batch = 3。</desc>
<style>text { font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; fill: #111827; } .sub { fill: #6b7280; }</style>
<defs>
<marker id="m2563eb" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="m059669" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
<marker id="mea580c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="m7c3aed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
<marker id="m6b7280" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="972" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="40" y="48" font-size="30" text-anchor="start" class="main" font-weight="600">消费者如何挑选一批可处理的事件</text>
<text x="40" y="86" font-size="20" text-anchor="start" class="sub" font-weight="400">示例：next = 3，claimed = 9，A 完成 6，B 完成 4，max_batch = 3。</text>
<rect x="350" y="125" width="500" height="95" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600.0" y="160" font-size="23" text-anchor="middle" class="main" font-weight="600">① 合并申请边界与依赖边界</text>
<text x="600.0" y="191" font-size="19" text-anchor="middle" class="main" font-weight="400">bound = min(9, 6, 4) = 4</text>
<rect x="350" y="295" width="500" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600.0" y="330" font-size="23" text-anchor="middle" class="main" font-weight="600">② 用 max_batch 限制扫描区间</text>
<text x="600.0" y="361" font-size="19" text-anchor="middle" class="main" font-weight="400">count = min(4 - 3 + 1, 3) = 2</text>
<text x="600.0" y="389" font-size="19" text-anchor="middle" class="main" font-weight="400">候选区间 [3, 4]</text>
<rect x="350" y="475" width="500" height="120" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="600.0" y="510" font-size="23" text-anchor="middle" class="main" font-weight="600">③ 从 next 开始逐槽 acquire 检查</text>
<text x="600.0" y="541" font-size="19" text-anchor="middle" class="main" font-weight="400">published[3] = 3：通过</text>
<text x="600.0" y="569" font-size="19" text-anchor="middle" class="main" font-weight="400">published[4] = 4：通过</text>
<rect x="350" y="675" width="500" height="135" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="600.0" y="710" font-size="23" text-anchor="middle" class="main" font-weight="600">④ 本批执行序列 3、4</text>
<text x="600.0" y="741" font-size="19" text-anchor="middle" class="main" font-weight="400">handler(3, false)，handler(4, true)</text>
<text x="600.0" y="769" font-size="19" text-anchor="middle" class="main" font-weight="400">整批返回后 release completed = 4</text>
<path d="M600 220 V295" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#m2563eb)"/>
<rect x="525.58" y="238" width="148.84" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="600" y="258" font-size="18" text-anchor="middle" class="main" font-weight="400">bound ≥ next</text>
<path d="M600 400 V475" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#m2563eb)"/>
<rect x="537.46" y="418" width="125.08000000000001" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="600" y="438" font-size="18" text-anchor="middle" class="main" font-weight="400">扫描 [3, 4]</text>
<path d="M600 595 V675" fill="none" stroke="#ea580c" stroke-width="2.3" marker-end="url(#mea580c)"/>
<rect x="524.14" y="615" width="151.72" height="28" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="600" y="635" font-size="18" text-anchor="middle" class="main" font-weight="400">available = 4</text>
<text x="40" y="850" font-size="20" text-anchor="start" class="sub" font-weight="400">max_batch 是上限：本次依赖边界只允许 2 个事件，不需要等待凑满 3 个。</text>
<path d="M48 905 H88" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#m2563eb)"/>
<text x="100" y="911" font-size="18" text-anchor="start" class="sub" font-weight="400">边界与标记检查</text>
<path d="M388 905 H428" fill="none" stroke="#ea580c" stroke-width="2.3" marker-end="url(#mea580c)"/>
<text x="440" y="911" font-size="18" text-anchor="start" class="sub" font-weight="400">获准执行批次</text>
</svg>
