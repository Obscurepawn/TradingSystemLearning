<rect x="0" y="0" width="1200" height="932" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="40" y="48" font-size="30" text-anchor="start" class="main" font-weight="600">共享事件，独立进度，依赖执行</text>
<text x="40" y="86" font-size="20" text-anchor="start" class="sub" font-weight="400">四个生产者写入同一组槽位；A、B、C 各自处理全部事件。</text>
<rect x="400" y="125" width="400" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600.0" y="160" font-size="23" text-anchor="middle" class="main" font-weight="600">应用生产者 P0 … P3</text>
<text x="600.0" y="191" font-size="19" text-anchor="middle" class="main" font-weight="400">申请 s → 填写 Event → 发布 s</text>
<rect x="240" y="320" width="720" height="100" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="600.0" y="355" font-size="23" text-anchor="middle" class="main" font-weight="600">slots_[s &amp; mask_]：预分配环形缓冲区</text>
<text x="600.0" y="386" font-size="19" text-anchor="middle" class="main" font-weight="400">Slot = published 标记 + Event；每轮复用同一对象</text>
<rect x="210" y="515" width="320" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="370.0" y="550" font-size="23" text-anchor="middle" class="main" font-weight="600">消费者 A / 独立线程</text>
<text x="370.0" y="581" font-size="19" text-anchor="middle" class="main" font-weight="400">读 id，写 left</text>
<text x="370.0" y="609" font-size="19" text-anchor="middle" class="main" font-weight="400">completed_A：整批完成进度</text>
<rect x="670" y="515" width="320" height="105" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="830.0" y="550" font-size="23" text-anchor="middle" class="main" font-weight="600">消费者 B / 独立线程</text>
<text x="830.0" y="581" font-size="19" text-anchor="middle" class="main" font-weight="400">读 id，写 right</text>
<text x="830.0" y="609" font-size="19" text-anchor="middle" class="main" font-weight="400">completed_B：整批完成进度</text>
<rect x="440" y="730" width="320" height="105" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="600.0" y="765" font-size="23" text-anchor="middle" class="main" font-weight="600">消费者 C / 独立线程</text>
<text x="600.0" y="796" font-size="19" text-anchor="middle" class="main" font-weight="400">依赖 A 和 B，校验同一 Event</text>
<text x="600.0" y="824" font-size="19" text-anchor="middle" class="main" font-weight="400">completed_C：本图唯一 gate</text>
